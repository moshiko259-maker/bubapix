# BubaPix admin panel (Sveltia CMS) — settings
#
# How saving works
#   Every change is saved as a DRAFT first (Editorial Workflow): a separate
#   branch and pull request in the GitHub repository. A GitHub Actions
#   workflow builds a preview of the whole site with the draft and puts a
#   "BubaPix preview" link on it. Nothing changes on the site until you press
#   "Publish" in the panel.
#
# Who can edit
#   Only GitHub accounts with write access to this repository, signed in with
#   their own token ("Sign In Using Access Token"). The token stays in the
#   browser; it is never stored in the site or the repository.
#   Fine-grained token permissions: Contents (read and write) and
#   Pull requests (read and write), for this repository only.

backend:
  name: github
  repo: moshiko259-maker/bubapix
  # Drafts are created from, and published to, this branch.
  # Change to "main" after the redesign is approved and merged.
  branch: redesign-v2
  # Name of the preview link that the build workflow attaches to drafts.
  preview_context: BubaPix preview

publish_mode: editorial_workflow

# Uploaded files are saved in this folder of the repository.
media_folder: assets/uploads
public_folder: /assets/uploads

slug:
  encoding: ascii
  clean_accents: true

media_libraries:
  # No stock photo sites: only your own original images can be used.
  stock_assets:
    providers: []
  default:
    config:
      max_file_size: 25000000   # 25 MB per file (GitHub is not made for large videos)
      slugify_filename: true    # safe file names: no spaces or Hebrew letters
      transformations:
        # Photos are converted to WebP and scaled down to at most 2400 px,
        # keeping their proportions. Smaller images are never enlarged.
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

# Folders of images the admin can see besides assets/uploads. The original
# work images (for example the THE NEW OCEAN poster) live in assets/work;
# without this entry the admin cannot find them and shows a broken preview.
asset_collections:
  - name: work_images
    label: "Original work images / תמונות מקור"
    media_folder: assets/work
    public_folder: /assets/work

collections:
  # ---------------------------------------------------------------------
  # Projects. "New" creates a project from its name only; every other part
  # is optional and appears on the site only when filled in. A project
  # without any image is not shown on the site at all (never half-finished).
  - name: projects
    label: "Projects / פרויקטים"
    label_singular: "Project / פרויקט"
    description: "To create a project: press New, type the project name, then Save. Only the name is needed; add images and texts whenever you like. Every part is optional and is shown only when filled in. A project appears on the site only once it has at least one image. / ליצירת פרויקט: לוחצים New, מקלידים את שם הפרויקט ושומרים. כל השאר אופציונלי, ומוצג רק כשממלאים אותו."
    icon: movie
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    duplicate: true
    identifier_field: title_en
    slug:
      template: "{{title_en}}"
      editable: [create]
      hint: "Web address of the page, filled in from the name. English letters, numbers and dashes only. / כתובת העמוד באתר, נוצרת מהשם. אותיות באנגלית, מספרים ומקפים בלבד."
      pattern: ['^[a-z0-9][a-z0-9-]*$', "Use English letters, numbers and dashes / אותיות באנגלית, מספרים ומקפים בלבד"]
    summary: "{{title_en}}"
    thumbnail: cover
    sortable_fields:
      fields: [order, title_en]
      default:
        field: order
        direction: ascending
    fields:
      # ---- Basics
      - name: title_en
        label: "Project name / שם הפרויקט"
        widget: string
        required: false
        hint: "Exactly as it should appear, e.g. THE NEW OCEAN. Shown on both the English and the Hebrew site. The page address is made from this name; a name in Hebrew letters only gets a short random address. / בדיוק כפי שיופיע, מוצג גם באתר העברי. כתובת העמוד נוצרת מהשם; לשם באותיות עבריות בלבד תיווצר כתובת קצרה אקראית."
      - name: title_he
        label: "Different name for the Hebrew site (optional) / שם שונה לאתר העברי (לא חובה)"
        widget: string
        required: false
        hint: "Leave empty to use the name above. / השאירו ריק כדי להשתמש בשם שלמעלה."
      - name: show_title
        label: "Show the name on the project page / להציג את השם בעמוד הפרויקט"
        widget: boolean
        default: true
        required: false
      - name: visible
        label: "Show on the site / להציג באתר"
        widget: boolean
        default: true
        required: false
        hint: "Turn off to hide the project without deleting it. / כבו כדי להסתיר בלי למחוק."
      - name: featured
        label: "Show in the homepage gallery / להציג בגלריה של דף הבית"
        widget: boolean
        default: true
        required: false
      - name: order
        label: "Order on the site (1 = first) / סדר באתר (1 = ראשון)"
        widget: number
        value_type: int
        min: 1
        default: 10
        required: false
      - name: title_in_gallery
        label: "Show the name under the image in galleries / להציג את השם מתחת לתמונה בגלריות"
        widget: boolean
        default: false
        required: false
      - name: cover
        label: "Cover image or poster / תמונת שער או פוסטר"
        widget: image
        required: false
        hint: "Shown whole, never cropped. / מוצגת בשלמותה, בלי חיתוך."
      - name: cover_alt_en
        label: "Cover description for blind visitors, English / תיאור התמונה לעיוורים, אנגלית"
        widget: string
        required: false
      - name: cover_alt_he
        label: "Cover description for blind visitors, Hebrew / תיאור התמונה לעיוורים, עברית"
        widget: string
        required: false
      - name: text_en
        label: "Short line under the name, English (optional) / שורה קצרה מתחת לשם, אנגלית"
        widget: string
        required: false
      - name: text_he
        label: "Short line under the name, Hebrew (optional) / שורה קצרה מתחת לשם, עברית"
        widget: string
        required: false
      - name: description_en
        label: "Synopsis, English / תקציר, אנגלית"
        widget: markdown
        required: false
        buttons: [bold, italic, link, bulleted-list, numbered-list]
        editor_components: []
      - name: description_he
        label: "Synopsis, Hebrew / תקציר, עברית"
        widget: markdown
        required: false
        buttons: [bold, italic, link, bulleted-list, numbered-list]
        editor_components: []

      # ---- Optional sections, in any order
      - name: sections
        label: "Page sections / אזורים בעמוד"
        label_singular: "section / אזור"
        widget: list
        required: false
        collapsed: auto
        hint: "Add only what you need. Drag to change the order. Turn on 'Hide' to hide a section without deleting it. / הוסיפו רק מה שצריך, גררו לשינוי הסדר."
        types:
          - name: creators
            label: "Words from the creators / דברי היוצרים"
            widget: object
            summary: "{{fields.heading_en}}"
            fields:
              - &hidden { name: hidden, label: "Hide this section / להסתיר את האזור", widget: boolean, default: false, required: false }
              - &heading_en { name: heading_en, label: "Heading, English (optional) / כותרת, אנגלית", widget: string, required: false, hint: "Empty: the usual heading is used. / ריק: תוצג הכותרת הרגילה." }
              - &heading_he { name: heading_he, label: "Heading, Hebrew (optional) / כותרת, עברית", widget: string, required: false }
              - name: items
                label: "Creators / יוצרים"
                label_singular: "creator / יוצר"
                widget: list
                collapsed: auto
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name, English / שם באנגלית", widget: string, hint: "For example Moses Appleboim or Dan Moskona. / לדוגמה Moses Appleboim או Dan Moskona." }
                  - { name: name_he, label: "Name, Hebrew / שם בעברית", widget: string, required: false, hint: "For example משה אפלבוים or דן מוסקונה." }
                  - { name: role_en, label: "Role, English (optional) / תפקיד, אנגלית", widget: string, required: false }
                  - { name: role_he, label: "Role, Hebrew (optional) / תפקיד, עברית", widget: string, required: false }
                  - { name: text_en, label: "Text, English / טקסט, אנגלית", widget: text, required: false }
                  - { name: text_he, label: "Text, Hebrew / טקסט, עברית", widget: text, required: false }
          - name: behind
            label: "Behind the scenes / מאחורי הקלעים"
            widget: object
            fields:
              - *hidden
              - *heading_en
              - *heading_he
              - { name: body_en, label: "Text, English: process, tools, techniques / טקסט, אנגלית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [] }
              - { name: body_he, label: "Text, Hebrew / טקסט, עברית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [] }
              - &images
                name: images
                label: "Images / תמונות"
                label_singular: "image / תמונה"
                widget: list
                required: false
                collapsed: auto
                thumbnail: image
                summary: "{{fields.title_en}}"
                hint: "Drag to change the order. / גררו לשינוי הסדר."
                fields:
                  - { name: image, label: "Image / תמונה", widget: image }
                  - { name: link, label: "Link when the picture is clicked (optional) / קישור בלחיצה על התמונה (רשות)", widget: string, required: false, pattern: ['^$|^https://|^/[a-z0-9/-]*$', "https://… or a site page like /shop/ / ‏https://… או עמוד באתר כמו /shop/"], hint: "Empty: the picture opens large. / ריק: התמונה נפתחת בגדול." }
                  - { name: alt_en, label: "Description for blind visitors, English / תיאור לעיוורים, אנגלית", widget: string, required: false }
                  - { name: alt_he, label: "Description for blind visitors, Hebrew / תיאור לעיוורים, עברית", widget: string, required: false }
                  - { name: title_en, label: "Title, English (optional) / כותרת, אנגלית", widget: string, required: false }
                  - { name: title_he, label: "Title, Hebrew (optional) / כותרת, עברית", widget: string, required: false }
                  - { name: note_en, label: "Note, English (optional) / הערה, אנגלית", widget: text, required: false }
                  - { name: note_he, label: "Note, Hebrew (optional) / הערה, עברית", widget: text, required: false }
                  - name: caption
                    label: "Where to show the title and note / היכן להציג כותרת והערה"
                    widget: select
                    default: hidden
                    required: false
                    options:
                      - { label: "Hidden (kept, not shown) / מוסתר (נשמר, לא מוצג)", value: hidden }
                      - { label: "On the project page only / בעמוד הפרויקט בלבד", value: project }
                      - { label: "Also under the image on the homepage / גם מתחת לתמונה בדף הבית", value: everywhere }
                  - { name: on_home, label: "Also show this image in the homepage gallery / להציג גם בגלריה של דף הבית", widget: boolean, default: false, required: false }
                  - name: frame
                    label: "Frame shape / צורת המסגרת"
                    widget: select
                    default: natural
                    required: false
                    hint: "Natural: the whole picture, never cropped. Other shapes fill the frame; choose below which part stays in view. / טבעית: התמונה כולה. צורות אחרות ממלאות את המסגרת."
                    options:
                      - { label: "Natural, whole picture / טבעית, התמונה כולה", value: natural }
                      - { label: "Cinema wide 2.4:1 / קולנוע רחב", value: wide }
                      - { label: "Landscape 16:9 / רוחבית", value: landscape }
                      - { label: "Square 1:1 / ריבועית", value: square }
                      - { label: "Portrait 4:5 / לאורך", value: portrait }
                  - name: focus
                    label: "Part that stays in view / החלק שנשאר במסגרת"
                    widget: select
                    default: center
                    required: false
                    options:
                      - { label: "Center / מרכז", value: center }
                      - { label: "Top / למעלה", value: top }
                      - { label: "Bottom / למטה", value: bottom }
                      - { label: "Left / שמאל", value: left }
                      - { label: "Right / ימין", value: right }
          - name: gallery
            label: "Image gallery / גלריית תמונות"
            widget: object
            fields:
              - *hidden
              - *heading_en
              - *heading_he
              - *images
          - name: videos
            label: "Videos / סרטונים"
            widget: object
            fields:
              - *hidden
              - *heading_en
              - *heading_he
              - name: items
                label: "Videos / סרטונים"
                label_singular: "video / סרטון"
                widget: list
                collapsed: auto
                summary: "{{fields.title_en}} {{fields.url}}"
                fields:
                  - name: url
                    label: "YouTube or Vimeo link (recommended) / קישור YouTube או Vimeo (מומלץ)"
                    widget: string
                    required: false
                    pattern: ['^$|^https://(www\.|m\.)?(youtube\.com|youtu\.be|vimeo\.com)/', "Use a YouTube or Vimeo address / כתובת YouTube או Vimeo"]
                  - { name: file, label: "Or a short MP4 file, up to 25 MB / או קובץ MP4 קצר", widget: file, required: false, accept: "video/mp4,video/webm" }
                  - { name: title_en, label: "Title, English (optional) / כותרת, אנגלית", widget: string, required: false }
                  - { name: title_he, label: "Title, Hebrew (optional) / כותרת, עברית", widget: string, required: false }
          - name: text
            label: "Text section / אזור טקסט"
            widget: object
            summary: "{{fields.heading_en}}"
            fields:
              - *hidden
              - { name: heading_en, label: "Heading, English (optional) / כותרת, אנגלית", widget: string, required: false }
              - { name: heading_he, label: "Heading, Hebrew (optional) / כותרת, עברית", widget: string, required: false }
              - { name: body_en, label: "Text, English / טקסט, אנגלית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [] }
              - { name: body_he, label: "Text, Hebrew / טקסט, עברית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [] }
          - name: details
            label: "Details list / רשימת פרטים"
            widget: object
            fields:
              - *hidden
              - *heading_en
              - *heading_he
              - name: items
                label: "Details / פרטים"
                label_singular: "detail / פרט"
                widget: list
                collapsed: auto
                summary: "{{fields.label_en}}: {{fields.value_en}}"
                hint: "For example Year, Length, Tools. Real information only. / לדוגמה שנה, אורך, כלים. מידע אמיתי בלבד."
                fields:
                  - { name: label_en, label: "Label, English / כותרת, אנגלית", widget: string, required: false }
                  - { name: label_he, label: "Label, Hebrew / כותרת, עברית", widget: string, required: false }
                  - { name: value_en, label: "Value, English / ערך, אנגלית", widget: string, required: false }
                  - { name: value_he, label: "Value, Hebrew / ערך, עברית", widget: string, required: false }

      # ---- Search engines and sharing (optional)
      - name: seo_title_en
        label: "Search title, English (optional) / כותרת לגוגל, אנגלית"
        widget: string
        required: false
        hint: "Shown in Google and when the page is shared. Empty: the project name is used. About 60 characters. / ריק: יוצג שם הפרויקט."
      - name: seo_title_he
        label: "Search title, Hebrew (optional) / כותרת לגוגל, עברית"
        widget: string
        required: false
      - name: seo_description_en
        label: "Search description, English (optional) / תיאור לגוגל, אנגלית"
        widget: text
        required: false
        hint: "About 150 characters. Empty: the short line or the site description is used. / ריק: תשמש השורה הקצרה או תיאור האתר."
      - name: seo_description_he
        label: "Search description, Hebrew (optional) / תיאור לגוגל, עברית"
        widget: text
        required: false

      # ---- Less common options
      - name: comments
        label: "Allow visitor comments on this project / לאפשר תגובות גולשים בפרויקט"
        widget: boolean
        default: true
        required: false
        hint: "Works only when comments are turned on in Settings › Visitor participation (off by default). / פועל רק כשהתגובות מופעלות בהגדרות (כבוי כברירת מחדל)."

  # ---------------------------------------------------------------------
  # Shop. Each product gets its own page under /shop/. Only real products:
  # no invented prices or stock. No online payment yet: the buy button opens
  # your store link (for example a print-on-demand shop) or an order email.
  - name: products
    label: "Shop products / מוצרים בחנות"
    label_singular: "Product / מוצר"
    description: "To add a product: press New, type its name, add a photo and a price, then Save. It appears in the Shop once it has a photo. Turn off 'Show in the shop' to hide it without deleting. / להוספת מוצר: New, שם, תמונה ומחיר, שמירה."
    icon: storefront
    folder: content/products
    extension: json
    format: json
    create: true
    delete: true
    duplicate: true
    identifier_field: title_en
    slug:
      template: "{{title_en}}"
      editable: [create]
      pattern: ['^[a-z0-9][a-z0-9-]*$', "Use English letters, numbers and dashes / אותיות באנגלית, מספרים ומקפים בלבד"]
    summary: "{{title_en}} · {{price}} {{currency}}"
    thumbnail: images.*.image
    sortable_fields:
      fields: [order, title_en, price]
      default:
        field: order
        direction: ascending
    fields:
      - { name: title_en, label: "Product name, English / שם המוצר, אנגלית", widget: string }
      - { name: title_he, label: "Product name, Hebrew / שם המוצר, עברית", widget: string, required: false }
      - { name: visible, label: "Show in the shop / להציג בחנות", widget: boolean, default: true, required: false }
      - { name: order, label: "Order (1 = first) / סדר", widget: number, value_type: int, min: 1, default: 10, required: false }
      - name: category
        label: "Category / קטגוריה"
        widget: relation
        collection: settings
        file: shop
        value_field: "categories.*.slug"
        search_fields: ["categories.*.name_en", "categories.*.name_he"]
        display_fields: ["categories.*.name_en"]
        required: false
      - name: type
        label: "Product type / סוג מוצר"
        widget: select
        default: physical
        required: false
        options:
          - { label: "Physical / פיזי", value: physical }
          - { label: "Digital download / דיגיטלי", value: digital }
          - { label: "Personalized / מותאם אישית", value: personalized }
          - { label: "Made to order / בהזמנה אישית", value: made-to-order }
      - name: images
        label: "Photos / תמונות"
        label_singular: "photo / תמונה"
        widget: list
        required: false
        collapsed: auto
        thumbnail: image
        hint: "The first photo is the main one. Drag to change the order. Real product photos are best. / התמונה הראשונה היא הראשית."
        fields:
          - { name: image, label: "Photo / תמונה", widget: image }
          - { name: alt_en, label: "Description for blind visitors, English / תיאור לעיוורים, אנגלית", widget: string, required: false }
          - { name: alt_he, label: "Description for blind visitors, Hebrew / תיאור לעיוורים, עברית", widget: string, required: false }
      - name: card_fit
        label: "Main photo in the shop grid / התמונה הראשית ברשת החנות"
        widget: select
        default: whole
        required: false
        options:
          - { label: "Whole photo / התמונה כולה", value: whole }
          - { label: "Fill the frame / מילוי המסגרת", value: fill }
      - name: card_focus
        label: "Part that stays in view (when filling) / החלק שנשאר במסגרת"
        widget: select
        default: center
        required: false
        options:
          - { label: "Center / מרכז", value: center }
          - { label: "Top / למעלה", value: top }
          - { label: "Bottom / למטה", value: bottom }
          - { label: "Left / שמאל", value: left }
          - { label: "Right / ימין", value: right }
      - { name: price, label: "Price (empty = not shown) / מחיר (ריק = לא מוצג)", widget: number, value_type: float, min: 0, required: false }
      - name: currency
        label: "Currency / מטבע"
        widget: string
        default: ILS
        required: false
        pattern: ['^$|^[A-Z]{3}$', "Three capital letters, e.g. ILS, USD, EUR, GBP / שלוש אותיות גדולות"]
        hint: "Any currency code: ILS (₪), USD ($), EUR (€), GBP (£), CAD, AUD, JPY… / כל קוד מטבע."
      - { name: price_abroad, label: "Price abroad (optional) / מחיר לחו״ל (לא חובה)", widget: number, value_type: float, min: 0, required: false, hint: "Shown as an extra line, e.g. for customers outside Israel. / מוצג כשורה נוספת." }
      - { name: currency_abroad, label: "Currency of the price abroad / מטבע המחיר לחו״ל", widget: string, default: USD, required: false, pattern: ['^$|^[A-Z]{3}$', "Three capital letters / שלוש אותיות גדולות"] }
      - name: ships_to
        label: "Shipping / משלוח"
        widget: select
        default: worldwide
        required: false
        options:
          - { label: "Israel and abroad / ישראל וחו״ל", value: worldwide }
          - { label: "Israel only / ישראל בלבד", value: israel }
          - { label: "Digital, no shipping / דיגיטלי, ללא משלוח", value: digital }
      - { name: price_from, label: "Price starts from (several options) / המחיר הוא \"החל מ־\"", widget: boolean, default: false, required: false }
      - name: availability
        label: "Availability / זמינות"
        widget: select
        default: available
        required: false
        options:
          - { label: "Available / זמין", value: available }
          - { label: "Pre-order / הזמנה מוקדמת", value: preorder }
          - { label: "Coming soon / בקרוב", value: soon }
          - { label: "Sold out / אזל", value: soldout }
      - { name: description_en, label: "Description, English / תיאור, אנגלית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
      - { name: description_he, label: "Description, Hebrew / תיאור, עברית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
      - name: details
        label: "More details (open on click: materials, size, care…) / פרטים נוספים (נפתחים בלחיצה: חומרים, מידות, טיפול…)"
        label_singular: "detail / פרט"
        widget: list
        required: false
        collapsed: auto
        summary: "{{fields.title_he}} · {{fields.title_en}}"
        fields:
          - { name: title_en, label: "Title, English / כותרת, אנגלית", widget: string, required: false }
          - { name: title_he, label: "Title, Hebrew / כותרת, עברית", widget: string, required: false }
          - { name: text_en, label: "Text, English / טקסט, אנגלית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
          - { name: text_he, label: "Text, Hebrew / טקסט, עברית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
      - name: variants
        label: "Options, e.g. size or color (optional) / אפשרויות, למשל מידה או צבע"
        label_singular: "option / אפשרות"
        widget: list
        required: false
        collapsed: auto
        summary: "{{fields.name_en}}: {{fields.values_en}}"
        fields:
          - { name: name_en, label: "Option name, English (e.g. Size) / שם, אנגלית", widget: string }
          - { name: name_he, label: "Option name, Hebrew (e.g. מידה) / שם, עברית", widget: string, required: false }
          - { name: values_en, label: "Choices, English, separated by commas (e.g. S, M, L) / בחירות, אנגלית", widget: string }
          - { name: values_he, label: "Choices, Hebrew, separated by commas / בחירות, עברית", widget: string, required: false }
      - name: projects
        label: "From these projects (optional) / מתוך הפרויקטים"
        widget: relation
        collection: projects
        value_field: "{{slug}}"
        search_fields: [title_en, title_he]
        display_fields: [title_en]
        multiple: true
        required: false
        hint: "The product is also shown on these projects' pages. / המוצר יוצג גם בעמודי הפרויקטים האלה."
      - name: buy_url
        label: "Buy link (optional) / קישור לקנייה"
        widget: string
        required: false
        pattern: ['^$|^https://', "Must start with https:// / חייב להתחיל ב־https://"]
        hint: "For example your product page on a print-on-demand or store site. Empty: visitors add the product to an order and send it to you as an order request by email. / ריק: המבקרים מוסיפים להזמנה ושולחים בקשת הזמנה במייל."
      - { name: seo_title_en, label: "Search title, English (optional) / כותרת לגוגל, אנגלית", widget: string, required: false }
      - { name: seo_title_he, label: "Search title, Hebrew (optional) / כותרת לגוגל, עברית", widget: string, required: false }
      - { name: seo_description_en, label: "Search description, English (optional) / תיאור לגוגל, אנגלית", widget: text, required: false }
      - { name: seo_description_he, label: "Search description, Hebrew (optional) / תיאור לגוגל, עברית", widget: text, required: false }

  # ---------------------------------------------------------------------
  - name: testimonials
    label: "Testimonials / המלצות"
    label_singular: "Testimonial / המלצה"
    description: "Add real quotes only. A testimonial is shown only when 'The client approved publishing' AND 'Show on the site' are both on. / רק ציטוטים אמיתיים. המלצה מוצגת רק כשגם 'הלקוח אישר פרסום' וגם 'להציג באתר' מסומנים."
    folder: content/testimonials
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    summary: "{{name}}"
    sortable_fields:
      fields: [order, name]
      default:
        field: order
        direction: ascending
    fields:
      - { name: name, label: "Name / שם", widget: string }
      - { name: role_en, label: "Role or company, English / תפקיד או חברה באנגלית", widget: string, required: false }
      - { name: role_he, label: "Role or company, Hebrew / תפקיד או חברה בעברית", widget: string, required: false }
      - { name: quote_en, label: "Quote, English / ציטוט באנגלית", widget: text, required: false }
      - { name: quote_he, label: "Quote, Hebrew / ציטוט בעברית", widget: text, required: false }
      - { name: consent_confirmed, label: "The client approved publishing this quote / הלקוח אישר לפרסם את ההמלצה", widget: boolean, default: false, hint: "Turn on only after the client agreed, in writing, that this exact text and name may be published. Keep the written approval in your own email, not here (this content is public on GitHub). / סמנו רק אחרי שהלקוח הסכים בכתב לפרסום הטקסט והשם. שמרו את האישור במייל שלכם, לא כאן (התוכן כאן ציבורי ב־GitHub)." }
      - { name: visible, label: "Show on the site / להציג באתר", widget: boolean, default: true }
      - { name: order, label: "Order / סדר", widget: number, value_type: int, min: 1, default: 10 }

  # ---------------------------------------------------------------------
  - name: pages
    label: "Extra pages / עמודים נוספים"
    label_singular: "Page / עמוד"
    description: "Free pages, for example a showreel or a press page. Address: /pages/<name>/."
    folder: content/pages
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title_en
    summary: "{{title_en}} · {{title_he}}"
    sortable_fields:
      fields: [order, title_en]
      default:
        field: order
        direction: ascending
    fields:
      - { name: title_en, label: "Title, English / כותרת באנגלית", widget: string, hint: "Also used for the page address." }
      - { name: title_he, label: "Title, Hebrew / כותרת בעברית", widget: string, required: false }
      - { name: visible, label: "Show on the site / להציג באתר", widget: boolean, default: true }
      - { name: show_in_menu, label: "Show in the top menu / להציג בתפריט העליון", widget: boolean, default: false, hint: "Otherwise the page is linked in the footer." }
      - { name: order, label: "Order / סדר", widget: number, value_type: int, min: 1, default: 10 }
      - { name: description_en, label: "Search description, English / תיאור לחיפוש באנגלית", widget: string, required: false }
      - { name: description_he, label: "Search description, Hebrew / תיאור לחיפוש בעברית", widget: string, required: false }
      - name: body_en
        label: "Text, English / טקסט באנגלית"
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
        editor_components: []
      - name: body_he
        label: "Text, Hebrew / טקסט בעברית"
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
        editor_components: []

  # ---------------------------------------------------------------------
  - name: settings
    label: "Site settings / הגדרות האתר"
    files:
      - name: site
        label: "Homepage / דף הבית"
        file: content/site.json
        format: json
        fields:
          - { name: hero_image, label: "Large opening image (optional) / תמונת פתיחה גדולה (לא חובה)", widget: image, required: false, hint: "Shown first, full width, never cropped. If it is also a project image, it is shown only once. / מוצגת ראשונה ברוחב מלא. אם היא גם תמונה של פרויקט, תוצג פעם אחת בלבד." }
          - { name: hero_alt_en, label: "Main image description, English / תיאור התמונה באנגלית", widget: string, required: false }
          - { name: hero_alt_he, label: "Main image description, Hebrew / תיאור התמונה בעברית", widget: string, required: false }
          - { name: feature_image, label: "Second opening picture, framed under the opening image (optional) / תמונת פתיחה שנייה, במסגרת מתחת לתמונת הפתיחה (רשות)", widget: image, required: false, hint: "Shown centred in a frame, with the opening sentence under it. Empty: not shown. It is not repeated in the gallery. / מוצגת במרכז במסגרת, ומשפט הפתיחה מתחתיה. ריק: לא מוצגת. לא חוזרת בגלריה." }
          - { name: feature_alt_en, label: "Second opening picture description, English / תיאור התמונה השנייה, אנגלית", widget: string, required: false }
          - { name: feature_alt_he, label: "Second opening picture description, Hebrew / תיאור התמונה השנייה, עברית", widget: string, required: false }
          - name: feature_project
            label: "Second opening picture opens this project's page (optional) / לחיצה על התמונה השנייה פותחת את דף הפרויקט (רשות)"
            widget: relation
            collection: projects
            value_field: "{{slug}}"
            search_fields: [title_en, title_he]
            display_fields: [title_en]
            required: false
          - name: showreel_url
            label: "Showreel video link, YouTube or Vimeo (optional) / קישור לשואוריל"
            widget: string
            required: false
            pattern: ['^$|^https://(www\.|m\.)?(youtube\.com|youtu\.be|vimeo\.com)/', "Use a YouTube or Vimeo address / כתובת YouTube או Vimeo"]
            hint: "Shown on the homepage above the gallery only when filled in. / מוצג בדף הבית רק כשממלאים."
          - name: gallery
            label: "Homepage gallery / הגלריה בדף הבית"
            label_singular: "image / תמונה"
            widget: list
            required: false
            collapsed: auto
            thumbnail: image
            summary: "{{fields.alt_en}}"
            hint: "Pictures shown on the homepage. Choose a project to make the picture open that project's page; leave it empty for a picture to look at only. Drag to change the order. Turn off 'Show' to hide one without deleting it. / תמונות בדף הבית. בחרו פרויקט כדי שלחיצה על התמונה תפתח את דף הפרויקט; בלי פרויקט — תמונה לתצוגה בלבד. גררו לשינוי הסדר."
            fields:
              - { name: image, label: "Image / תמונה", widget: image }
              - { name: visible, label: "Show / להציג", widget: boolean, default: true, required: false }
              - name: size
                label: "Size on the homepage / גודל בדף הבית"
                widget: select
                default: auto
                required: false
                hint: "Automatic keeps an interesting rhythm of big and small pictures. / אוטומטי שומר על קצב מעניין של תמונות גדולות וקטנות."
                options:
                  - { label: "Automatic / אוטומטי", value: auto }
                  - { label: "Large / גדולה", value: large }
                  - { label: "Medium / בינונית", value: medium }
                  - { label: "Small / קטנה", value: small }
              - { name: link, label: "Or: another link when clicked (optional) / או: קישור אחר בלחיצה (רשות)", widget: string, required: false, pattern: ['^$|^https://|^/[a-z0-9/-]*$', "https://… or a site page like /shop/ / ‏https://… או עמוד באתר כמו /shop/"] }
              - name: project
                label: "Opens this project's page (optional) / לחיצה פותחת את דף הפרויקט (רשות)"
                widget: relation
                collection: projects
                value_field: "{{slug}}"
                search_fields: [title_en, title_he]
                display_fields: [title_en]
                required: false
              - { name: alt_en, label: "Description for blind visitors, English / תיאור לעיוורים, אנגלית", widget: string, required: false }
              - { name: alt_he, label: "Description for blind visitors, Hebrew / תיאור לעיוורים, עברית", widget: string, required: false }
              - { name: title_en, label: "Title, English (optional) / כותרת, אנגלית", widget: string, required: false }
              - { name: title_he, label: "Title, Hebrew (optional) / כותרת, עברית", widget: string, required: false }
              - { name: note_en, label: "Note, English (optional) / הערה, אנגלית", widget: text, required: false }
              - { name: note_he, label: "Note, Hebrew (optional) / הערה, עברית", widget: text, required: false }
              - name: caption
                label: "Show the title and note under the picture / להציג כותרת והערה מתחת לתמונה"
                widget: select
                default: hidden
                required: false
                options:
                  - { label: "No (kept, not shown) / לא (נשמר, לא מוצג)", value: hidden }
                  - { label: "Yes / כן", value: everywhere }
              - name: frame
                label: "Frame shape / צורת המסגרת"
                widget: select
                default: natural
                required: false
                hint: "Natural: the whole picture, never cropped. Other shapes fill the frame; choose below which part stays in view. / טבעית: התמונה כולה. צורות אחרות ממלאות את המסגרת."
                options:
                  - { label: "Natural, whole picture / טבעית, התמונה כולה", value: natural }
                  - { label: "Cinema wide 2.4:1 / קולנוע רחב", value: wide }
                  - { label: "Landscape 16:9 / רוחבית", value: landscape }
                  - { label: "Square 1:1 / ריבועית", value: square }
                  - { label: "Portrait 4:5 / לאורך", value: portrait }
              - name: focus
                label: "Part that stays in view / החלק שנשאר במסגרת"
                widget: select
                default: center
                required: false
                options:
                  - { label: "Center / מרכז", value: center }
                  - { label: "Top / למעלה", value: top }
                  - { label: "Bottom / למטה", value: bottom }
                  - { label: "Left / שמאל", value: left }
                  - { label: "Right / ימין", value: right }
          - { name: tagline_en, label: "Tagline, English / סלוגן באנגלית", widget: string, required: false }
          - { name: tagline_he, label: "Tagline, Hebrew / סלוגן בעברית", widget: string, required: false }
          - { name: intro_en, label: "Short intro under the gallery, English (optional) / משפט פתיחה מתחת לגלריה, אנגלית", widget: text, required: false }
          - { name: intro_he, label: "Short intro under the gallery, Hebrew (optional) / משפט פתיחה מתחת לגלריה, עברית", widget: text, required: false }
          - { name: seo_description_en, label: "Search description, English / תיאור לחיפוש באנגלית", widget: string, required: false, hint: "Shown by Google under the site name. About 150 characters." }
          - { name: seo_description_he, label: "Search description, Hebrew / תיאור לחיפוש בעברית", widget: string, required: false }

      - name: shop
        label: "Shop / חנות"
        file: content/shop.json
        format: json
        fields:
          - { name: intro_en, label: "Short intro, English (optional) / פתיח קצר, אנגלית", widget: text, required: false }
          - { name: intro_he, label: "Short intro, Hebrew (optional) / פתיח קצר, עברית", widget: text, required: false }
          - { name: shipping_israel_en, label: "Shipping in Israel, English (price, time…) / משלוח בישראל, אנגלית", widget: text, required: false, hint: "Shown on product pages. Write only real terms. Empty: not shown. / מוצג בעמודי המוצרים. רק תנאים אמיתיים." }
          - { name: shipping_israel_he, label: "Shipping in Israel, Hebrew / משלוח בישראל, עברית", widget: text, required: false }
          - { name: shipping_abroad_en, label: "Shipping abroad, English / משלוח לחו״ל, אנגלית", widget: text, required: false }
          - { name: shipping_abroad_he, label: "Shipping abroad, Hebrew / משלוח לחו״ל, עברית", widget: text, required: false }
          - { name: shipping_israel_price, label: "Shipping price in Israel (number, optional) / מחיר משלוח בישראל (מספר, רשות)", widget: number, value_type: float, min: 0, required: false, hint: "Shown on every product page and added in the order summary. Empty: not shown. / מוצג בכל עמוד מוצר ומתווסף בסיכום ההזמנה. ריק: לא מוצג." }
          - { name: shipping_israel_currency, label: "Currency of the shipping price in Israel / מטבע מחיר המשלוח בישראל", widget: string, required: false, default: "ILS", pattern: ['^$|^[A-Z]{3}$', "Three capital letters, e.g. ILS / שלוש אותיות גדולות"] }
          - { name: free_shipping_israel_from, label: "Free shipping in Israel from order amount (optional) / משלוח חינם בישראל מסכום הזמנה (רשות)", widget: number, value_type: float, min: 0, required: false }
          - { name: shipping_abroad_price, label: "Shipping price abroad (number, optional) / מחיר משלוח לחו״ל (מספר, רשות)", widget: number, value_type: float, min: 0, required: false }
          - { name: shipping_abroad_currency, label: "Currency of the shipping price abroad / מטבע מחיר המשלוח לחו״ל", widget: string, required: false, default: "USD", pattern: ['^$|^[A-Z]{3}$', "Three capital letters, e.g. USD / שלוש אותיות גדולות"] }
          - name: vat
            label: "VAT (מע״מ) / מע״מ"
            widget: select
            required: false
            default: ""
            hint: "Ask your accountant which applies to you. By law, prices for consumers in Israel must include VAT, so set prices with VAT included. Empty: VAT is not mentioned. / בדקו עם רואה החשבון מה חל עליכם. לפי החוק, מחיר לצרכן בישראל חייב לכלול מע״מ, לכן קבעו מחירים כולל מע״מ. ריק: מע״מ לא מוזכר."
            options:
              - { label: "Not mentioned / לא מוזכר", value: "" }
              - { label: "Prices include VAT / המחירים כוללים מע״מ", value: included }
              - { label: "No VAT (e.g. exempt dealer) / ללא מע״מ (למשל עוסק פטור)", value: none }
          - { name: vat_rate, label: "VAT rate in % / שיעור המע״מ באחוזים", widget: number, value_type: float, min: 0, max: 100, default: 18, required: false, hint: "18% in Israel since 1 January 2025. / 18% בישראל מאז 1 בינואר 2025." }
          - { name: returns_en, label: "Shipping, returns and exchanges, English (optional) / משלוח, החזרות והחלפות, אנגלית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
          - { name: returns_he, label: "Shipping, returns and exchanges, Hebrew (optional) / משלוח, החזרות והחלפות, עברית", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list], editor_components: [], hint: "Shown on every product page, opened on click. Write only your real policy. / מוצג בכל עמוד מוצר, נפתח בלחיצה. כתבו רק את המדיניות האמיתית שלכם." }
          - name: checkout
            label: "How orders are sent / איך נשלחות הזמנות"
            widget: select
            default: email
            required: false
            options:
              - { label: "Order request by email (no online payment) / בקשת הזמנה במייל (בלי תשלום אונליין)", value: email }
            hint: "Online payment can be added later with a payment provider; that needs your approval and an account with the provider. / תשלום אונליין יתווסף בעתיד, באישורך."
          - name: categories
            label: "Categories / קטגוריות"
            label_singular: "category / קטגוריה"
            widget: list
            allow_reorder: true
            collapsed: auto
            summary: "{{fields.name_en}} · {{fields.name_he}}"
            hint: "Add as many as you need; drag to change the order. A category appears in the shop when it has products, or always if you turn on 'Show before it has products'. / הוסיפו כמה שצריך; גררו לשינוי הסדר. קטגוריה מוצגת כשיש בה מוצרים, או תמיד אם מפעילים ״להציג גם לפני שיש מוצרים״."
            fields:
              - { name: name_he, label: "Name, Hebrew / שם, עברית", widget: string, required: false }
              - { name: name_en, label: "Name, English / שם, אנגלית", widget: string }
              - { name: slug, label: "Short ID in English letters (a-z and dashes, e.g. mugs) / מזהה קצר באותיות אנגליות (למשל mugs)", widget: string, pattern: ['^[a-z0-9][a-z0-9-]*$', "Use a-z, 0-9 and dashes"] }
              - { name: image, label: "Category picture (optional) / תמונה לקטגוריה (רשות)", widget: image, required: false }
              - { name: show_when_empty, label: "Show before it has products (\"coming soon\") / להציג גם לפני שיש מוצרים (״בקרוב״)", widget: boolean, default: false, required: false }
              - name: parent
                label: "Main category (only for a subcategory) / קטגוריה ראשית (רק לתת־קטגוריה)"
                widget: relation
                collection: settings
                file: shop
                value_field: "categories.*.slug"
                search_fields: ["categories.*.name_he", "categories.*.name_en"]
                display_fields: ["categories.*.name_he", "categories.*.name_en"]
                required: false
                hint: "Empty: a main category. Choose one to make this a subcategory of it (for example T-shirts under Clothing). One level only. / ריק: קטגוריה ראשית. בחירה הופכת אותה לתת־קטגוריה (למשל חולצות תחת ביגוד). רמה אחת בלבד."
          - name: currencies
            label: "Currencies visitors can choose to view prices in / מטבעות שהגולש יכול לבחור לתצוגת מחירים"
            widget: list
            required: false
            field: { name: code, label: "Currency code (USD, ILS, EUR, GBP…) / קוד מטבע", widget: string, pattern: ['^[A-Z]{3}$', "Three capital letters, e.g. USD / שלוש אותיות גדולות"] }
            hint: "Prices in a chosen currency are approximate (converted with current exchange rates, updated automatically). Orders always use the price you set. Empty: ILS, USD, EUR. / המחירים במטבע שנבחר משוערים (לפי שערי חליפין שמתעדכנים אוטומטית). ההזמנה תמיד לפי המחיר שקבעתם."
          - name: manual_rates
            label: "Manual exchange rates (only if a currency is missing) / שערי חליפין ידניים (רק אם מטבע חסר)"
            label_singular: "rate / שער"
            widget: list
            required: false
            collapsed: true
            summary: "1 USD = {{fields.per_usd}} {{fields.code}}"
            hint: "Normally not needed: the rates are downloaded automatically from the European Central Bank. / בדרך כלל לא צריך: השערים יורדים אוטומטית מהבנק המרכזי האירופי."
            fields:
              - { name: code, label: "Currency code / קוד מטבע", widget: string, pattern: ['^[A-Z]{3}$', "Three capital letters / שלוש אותיות גדולות"] }
              - { name: per_usd, label: "How much is 1 US dollar in this currency / כמה שווה דולר אחד במטבע הזה", widget: number, value_type: float, min: 0 }
          - name: payment_methods
            label: "Payment methods / אמצעי תשלום"
            label_singular: "payment method / אמצעי תשלום"
            widget: list
            required: false
            collapsed: auto
            summary: "{{fields.label_en}} ({{fields.kind}}) — on: {{fields.enabled}}"
            hint: "Prepared for the future: each method stays OFF until you switch it on with your real account details. After a visitor sends an order request, the methods that are on are offered; each opens the provider's own secure page. The site never sees card details. / מוכן לעתיד: כל אמצעי כבוי עד שתפעילו אותו עם פרטי חשבון אמיתיים. אחרי שליחת בקשת הזמנה מוצגים האמצעים הפעילים; כל אחד פותח את הדף המאובטח של חברת התשלום. האתר לא רואה פרטי כרטיס."
            fields:
              - { name: enabled, label: "On / פעיל", widget: boolean, default: false, required: false }
              - name: kind
                label: "Type / סוג"
                widget: select
                default: link
                options:
                  - { label: "PayPal.Me (the amount is filled in automatically) / פייפאל (הסכום ממולא אוטומטית)", value: paypal }
                  - { label: "Payment link (Bit, PayBox, Grow, card payment page…) / קישור תשלום (ביט, פייבוקס, Grow, דף תשלום באשראי…)", value: link }
              - { name: label_en, label: "Button name, English (e.g. PayPal, Bit, Credit card) / שם הכפתור, אנגלית", widget: string, required: false }
              - { name: label_he, label: "Button name, Hebrew (e.g. ביט, כרטיס אשראי) / שם הכפתור, עברית", widget: string, required: false }
              - { name: paypal_me, label: "PayPal.Me name (for PayPal only; the part after paypal.me/) / שם PayPal.Me (רק לפייפאל)", widget: string, required: false, pattern: ['^$|^[A-Za-z0-9]{1,40}$', "Letters and digits only / אותיות וספרות בלבד"] }
              - { name: url, label: "Payment link (for a payment link only; starts with https://) / קישור תשלום (מתחיל ב־https://)", widget: string, required: false, pattern: ['^$|^https://', "Must start with https:// / חייב להתחיל ב־https://"] }
              - { name: note_en, label: "Short note, English (optional) / הערה קצרה, אנגלית", widget: string, required: false }
              - { name: note_he, label: "Short note, Hebrew (optional) / הערה קצרה, עברית", widget: string, required: false }

